name: Release

on:
  push:
    branches:
      - main
      - 'release/v*'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-15
          - platform: macos
            arch: x86_64
            runner: macos-15-intel
          - platform: linux
            arch: x86_64
            runner: ubuntu-24.04
          - platform: windows
            arch: x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libvulkan1 mesa-vulkan-drivers xvfb xdotool
      - name: Build release binaries
        env:
          GREENCODE_MAIN_COMMIT: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
        run: cargo build --locked --workspace --release
      - name: Smoke-test CLI
        shell: bash
        run: |
          export GREENCODE_HOME="$RUNNER_TEMP/greencode-smoke"
          if [ "$RUNNER_OS" = Windows ]; then
            ./target/release/greencode-cli.exe --help
            if output=$(./target/release/greencode-cli.exe auth import 2>&1); then
              echo "Expected Windows login import to be rejected" >&2
              exit 1
            fi
            grep -F "requires Unix credential storage" <<< "$output"
          else
            ./target/release/greencode-cli --help
          fi
      - name: Smoke-test Linux window
        if: runner.os == 'Linux'
        run: |
          export GREENCODE_HOME="$RUNNER_TEMP/greencode-smoke"
          mkdir -p "$XDG_RUNTIME_DIR"
          timeout 40s xvfb-run -a bash -eu -c '
            ./target/release/greencode &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            for i in {1..25}; do
              kill -0 "$pid"
              if xdotool search --onlyvisible --name "^GreenCode$"; then exit 0; fi
              sleep 1
            done
            exit 1
          '
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/greencode-xdg
      - name: Smoke-test Windows window
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GREENCODE_HOME = Join-Path $env:RUNNER_TEMP greencode-smoke
          $proc = Start-Process .\target\release\greencode.exe -PassThru
          try {
            for ($i = 0; $i -lt 25; $i++) {
              $proc.Refresh()
              if ($proc.HasExited) { throw "GreenCode exited with $($proc.ExitCode)" }
              if ($proc.MainWindowTitle -eq 'GreenCode') { return }
              Start-Sleep -Seconds 1
            }
            throw "No GreenCode window appeared"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id }
          }
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/GreenCode.app/Contents/MacOS
          cp target/release/greencode target/release/greencode-cli dist/GreenCode.app/Contents/MacOS/
          sed "s/@VERSION@/$(sed -n 's/^version *= *\"\(.*\)\"/\1/p' Cargo.toml | head -1)/" packaging/macos/Info.plist > dist/GreenCode.app/Contents/Info.plist
          plutil -lint dist/GreenCode.app/Contents/Info.plist
          tar -czf "dist/greencode-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C target/release greencode greencode-cli -C "$GITHUB_WORKSPACE/dist" GreenCode.app
      - name: Package Unix binaries
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf "dist/greencode-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C target/release greencode greencode-cli
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Compress-Archive -Path target/release/greencode.exe,target/release/greencode-cli.exe -DestinationPath dist/greencode-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub builds
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    concurrency:
      group: publish-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum greencode-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: dist/*
      - name: Publish main commit build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head_sha=$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping a build superseded by $head_sha"
            exit 0
          fi
          if ! gh release view main-build >/dev/null 2>&1; then
            gh release create main-build --draft --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "GreenCode main build" \
              --notes "Rolling pre-release. Each binary asset is labeled with its commit SHA; the source archives are from the original tag."
          fi
          assets=()
          for archive in dist/greencode-*; do
            assets+=("$archive#$GITHUB_SHA")
          done
          gh release upload main-build --clobber "${assets[@]}" dist/SHA256SUMS
          jq -Rn --arg commit "$GITHUB_SHA" \
            '{commit: $commit, sha256: ([inputs | split("  ") | {key: .[1], value: .[0]}] | from_entries)}' \
            < dist/SHA256SUMS > dist/update.json
          gh release upload main-build --clobber dist/update.json
          gh release edit main-build --draft=false --prerelease --latest=false
