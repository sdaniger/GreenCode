[package]
name = "greencode-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "greencode"
path = "src/main.rs"

[dependencies]
greencode-core = { path = "../core" }
gpui-kit = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time"] }
vt100 = "0.18.1"
libc = "0.2.191"
open = "5"
percent-encoding = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSURL", "objc2-core-foundation"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
portable-pty = "0.9"

[dev-dependencies]
gpui-kit = { version = "0.9", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["tiff"] }
