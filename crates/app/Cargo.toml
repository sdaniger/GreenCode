[package]
name = "greencode-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "greencode"
path = "src/main.rs"

[dependencies]
greencode-core = { path = "../core" }
gpui-kit = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
gpui-kit = { version = "0.9", features = ["test-support"] }
