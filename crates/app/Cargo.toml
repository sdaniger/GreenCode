[package]
name = "greencode-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "greencode"
path = "src/main.rs"

[dependencies]
greencode-core = { path = "../core" }
gpui-kit = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time"] }
vt100 = "0.18.1"
libc = "0.2.191"

[dev-dependencies]
gpui-kit = { version = "0.9", features = ["test-support"] }
