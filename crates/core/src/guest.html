<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenCode (guest)</title><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#e5e5e5;font:15px system-ui;display:flex;flex-direction:column;height:100dvh}header,form{padding:1em;border-bottom:1px solid #333}#messages{flex:1;overflow:auto;padding:1em;white-space:pre-wrap;overflow-wrap:anywhere}.message{padding:1em;margin:.5em 0;background:#202126;border-radius:10px}.user{background:#303440}.tool,.think{margin:.4em 0;padding:.4em .8em;background:#1a1b20;border-radius:8px;color:#9aa;font-size:13px}.tool pre{margin:.4em 0 0;white-space:pre-wrap;color:#bbb}button,textarea{font:inherit;color:inherit;background:#272930;border:1px solid #444;border-radius:6px;padding:.65em}textarea{flex:1;resize:vertical}form{display:flex;gap:.5em;border-top:1px solid #333;border-bottom:0}#status{color:#aaa}
</style></head><body><header><b id="title">GreenCode</b> <span id="model"></span> <span>read-only guest view</span> <span id="status"></span></header><div id="messages"></div><form id="composer"><textarea id="text" placeholder="Ask the owner to send a message (they review it first)" rows="2"></textarea><button>Request</button></form><script>
const base=location.pathname.replace(/\/$/,''),$=s=>document.querySelector(s);let events=null,answer=null,tools={};
function add(text,cls){const d=document.createElement('div');d.className=cls;d.textContent=text;$('#messages').append(d);return d}
async function load(){const r=await fetch(base+'/thread');if(!r.ok){$('#status').textContent=r.status===404?'This link has expired or was revoked.':r.statusText;return}const d=await r.json();$('#title').textContent=d.title||'GreenCode';$('#model').textContent=d.model?'· '+d.model:'';$('#messages').replaceChildren();answer=null;for(const m of d.messages)for(const b of m.content){if(b.type==='text'&&b.text)add(b.text,'message '+m.role);else if(b.type==='thinking'&&b.thinking)add('💭 '+b.thinking,'think');else if(b.type==='tool_use')add('🔧 '+b.name+' '+(b.input&&(b.input.command||b.input.path)||''),'tool');else if(b.type==='tool_result'){const t=add('','tool');t.textContent=(b.is_error?'✗ ':'✓ ')+String(b.content).slice(0,500)}}$('#messages').lastElementChild?.scrollIntoView()}
function watch(){if(events)return;events=new EventSource(base+'/events');events.onmessage=e=>{const v=JSON.parse(e.data);if(v.type==='text'){if(!answer)answer=add('','message assistant');answer.textContent+=v.text}else if(v.type==='tool_start'){answer=null;tools[v.id]=add('🔧 '+v.name+' '+(v.input&&(v.input.command||v.input.path)||''),'tool')}else if(v.type==='tool_end'&&tools[v.id]){tools[v.id].textContent=(v.is_error?'✗ ':'✓ ')+tools[v.id].textContent.replace(/^\S+ /,'')}else if(v.type==='dialog'){add('❓ '+((v.request&&(v.request.title||v.request.message))||'Agent question')+' (the owner answers this)','think')}else if(v.type==='done'){events.close();events=null;load()}};events.onerror=()=>{events.close();events=null}}
$('#composer').onsubmit=async e=>{e.preventDefault();const text=$('#text').value.trim();if(!text)return;const r=await fetch(base+'/request',{method:'POST',body:JSON.stringify({text})});if(r.ok){$('#text').value='';$('#status').textContent='Request sent; waiting for the owner.'}else $('#status').textContent=(await r.json()).error};
load();setInterval(()=>{if(!events){load();watch()}},3000);watch();
</script></body></html>
