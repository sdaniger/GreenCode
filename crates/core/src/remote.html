<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenCode</title><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#e5e5e5;font:15px system-ui}main{display:flex;height:100dvh}aside{width:260px;border-right:1px solid #333;overflow:auto;padding:1em}section{flex:1;min-width:0;display:flex;flex-direction:column}header,form{padding:1em;border-bottom:1px solid #333}#messages{flex:1;overflow:auto;padding:1em;white-space:pre-wrap;overflow-wrap:anywhere}.message{padding:1em;margin:.5em 0;background:#202126;border-radius:10px}.tool{margin:.4em 0;padding:.4em .8em;background:#1a1b20;border-radius:8px}.tool summary{cursor:pointer;color:#9aa}.tool pre{margin:.4em 0 0;white-space:pre-wrap;font-size:12px;color:#bbb}.user{background:#303440}button,input,textarea{font:inherit;color:inherit;background:#272930;border:1px solid #444;border-radius:6px;padding:.65em}button{cursor:pointer}aside button{width:100%;text-align:left;margin:.2em 0}textarea{width:100%;resize:vertical}form{display:flex;gap:.5em}#approval,#dialog{padding:.5em;display:none}#dialog input{width:100%;margin:.3em 0}#requests div{padding:.5em 1em;border-bottom:1px solid #333}#status{color:#aaa}@media(max-width:600px){aside{width:36%;padding:.4em}header,form{padding:.5em}}
</style></head><body><main><aside><h2>GreenCode</h2><button id="new">＋ New thread</button><div id="threads"></div></aside><section><header><span id="title">Select a thread</span> <span id="status"></span> <button id="stop">Stop</button> <button id="share">Share</button> <button id="unshare">Unshare</button></header><div id="requests"></div><div id="messages"></div><div id="dialog"></div><div id="approval"><span id="permission"></span> <button data-decision="allow">Allow</button> <button data-decision="always">Always</button> <button data-decision="deny">Deny</button></div><form id="composer"><textarea id="text" placeholder="Message" rows="2"></textarea><button>Send</button></form></section></main><script>
const token=new URLSearchParams(location.search).get('token');let id=null,events=null;const tools={};const $=s=>document.querySelector(s);async function api(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});if(!r.ok)throw Error((await r.json()).error||r.statusText);return r.json()}function message(text,role='assistant'){const d=document.createElement('div');d.className='message '+role;d.textContent=text;$('#messages').append(d);d.scrollIntoView();return d}async function list(){const threads=await api('/api/threads');$('#threads').replaceChildren();for(const t of threads){const b=document.createElement('button');b.textContent=t.title||t.id;b.onclick=()=>open(t.id);$('#threads').append(b)}}async function open(thread){id=thread;const d=await api('/api/threads/'+id);$('#title').textContent=d.meta.title||id;$('#messages').replaceChildren();for(const m of d.messages){const text=m.content.map(b=>b.text||((b.type==='tool_use')?'🔧 '+b.name:'')).filter(Boolean).join('\n');if(text)message(text,m.role)}requests().catch(show)}function watch(thread){if(events)events.close();events=new EventSource('/api/threads/'+thread+'/events?token='+encodeURIComponent(token));let answer;events.onmessage=e=>{const v=JSON.parse(e.data);if(id!==thread)return;if(v.type==='text'){if(!answer)answer=message('');answer.textContent+=v.text;answer.scrollIntoView()}else if(v.type==='tool_start'){const d=document.createElement('details');d.className='tool';const sum=document.createElement('summary');sum.textContent='🔧 '+v.name+' '+(v.input&&v.input.command?v.input.command:(v.input&&v.input.path?v.input.path:''));d.append(sum);const pre=document.createElement('pre');pre.textContent='';d.append(pre);$('#messages').append(d);tools[v.id]=d;answer=null}else if(v.type==='tool_end'){const d=tools[v.id];if(d){d.querySelector('summary').textContent=(v.is_error?'✗ ':'✓ ')+d.querySelector('summary').textContent.replace(/^[^ ]+ /,'');d.querySelector('pre').textContent=v.output||'';d.open=!!v.is_error}else{message((v.is_error?'✗ ':'✓ ')+(v.output||''))}}else if(v.type==='usage'){$('#status').textContent='in '+v.input+' · out '+v.output}else if(v.type==='dialog')dialog(v.request);else if(v.type==='permission'){$('#permission').textContent=v.tool+': '+v.summary;$('#approval').style.display='block'}else if(v.type==='error')message('Error: '+v.text);else if(v.type==='done'){events.close();$('#status').textContent='';list().catch(show)}};events.onerror=()=>{$('#status').textContent='Connection lost';events.close()}}function show(e){$('#status').textContent=e.message}$('#new').onclick=async()=>{const cwd=prompt('Project directory (absolute path):');if(!cwd)return;const text=prompt('First message:');if(!text)return;try{const t=await api('/api/threads',{method:'POST',body:JSON.stringify({cwd,prompt:text})});id=t.id;$('#title').textContent=t.id;$('#messages').replaceChildren();message(text,'user');$('#status').textContent='Running…';watch(id)}catch(e){show(e)}};$('#composer').onsubmit=async e=>{e.preventDefault();const text=$('#text').value.trim();if(!id||!text)return;try{await api('/api/threads/'+id+'/prompt',{method:'POST',body:JSON.stringify({text})});$('#text').value='';message(text,'user');$('#status').textContent='Running…';watch(id)}catch(e){show(e)}};document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{try{await api('/api/threads/'+id+'/approve',{method:'POST',body:JSON.stringify({decision:b.dataset.decision})});$('#approval').style.display='none'}catch(e){show(e)}});
$('#stop').onclick=async()=>{if(!id)return;try{await api('/api/threads/'+id+'/cancel',{method:'POST'});$('#approval').style.display=$('#dialog').style.display='none'}catch(e){show(e)}};
$('#share').onclick=async()=>{if(!id)return;try{const s=await api('/api/threads/'+id+'/share',{method:'POST'});prompt('Read-only guest link (valid for 24 hours):',s.url)}catch(e){show(e)}};
$('#unshare').onclick=async()=>{if(!id)return;try{const r=await api('/api/threads/'+id+'/unshare',{method:'POST'});$('#status').textContent=r.revoked+' guest link(s) revoked'}catch(e){show(e)}};
async function requests(){const box=$('#requests');if(!id){box.replaceChildren();return}const list=await api('/api/threads/'+id+'/requests');box.replaceChildren();for(const r of list){const d=document.createElement('div');d.append('Guest request: '+r.text+' ');for(const [label,action] of [['Send','send'],['Dismiss','dismiss']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await api('/api/threads/'+id+'/requests/'+r.id+'/'+action,{method:'POST'});if(action==='send'){message(r.text,'user');$('#status').textContent='Running…';watch(id)}requests()}catch(e){show(e)}};d.append(b)}box.append(d)}}
setInterval(()=>requests().catch(()=>{}),5000);
function dialog(r){const box=$('#dialog');box.replaceChildren();box.style.display='block';const send=async reply=>{try{await api('/api/threads/'+id+'/answer',{method:'POST',body:JSON.stringify({reply})});box.style.display='none'}catch(e){show(e)}};const add=(tag,text)=>{const e=document.createElement(tag);if(text)e.textContent=text;box.append(e);return e};
if(r.method==='ask'){const forms=r.questions.map(q=>{add('div',q.question);const multi=q.multiSelect||q.multi;const opts=(q.options||[]).map(o=>{const l=add('label'),c=document.createElement('input');c.type=multi?'checkbox':'radio';c.name=q.id;c.style.width='auto';l.append(c,' '+o.label+' ');return [c,o.label]});const t=add('input');t.placeholder='Other';return {q,opts,t}});add('button','Submit').onclick=()=>send({answers:forms.map(({q,opts,t})=>{const selectedOptions=opts.filter(([c])=>c.checked).map(([,l])=>l);const a={id:q.id,selectedOptions};if(!selectedOptions.length&&t.value.trim())a.customInput=t.value.trim();return a})})}
else if(r.method==='confirm'){add('div',(r.title||'')+' '+(r.message||''));add('button','Yes').onclick=()=>send({confirmed:true});add('button','No').onclick=()=>send({confirmed:false})}
else if(r.method==='select'){add('div',(r.title||'')+' '+(r.message||''));for(const o of r.options||[])add('button',o).onclick=()=>send({value:o})}
else{add('div',(r.title||'Agent question')+' '+(r.message||''));const t=add('input');if(r.secret)t.type='password';add('button','Submit').onclick=()=>send({value:t.value})}
add('button','Cancel').onclick=()=>send({cancelled:true})}
list().catch(show);
</script></body></html>
