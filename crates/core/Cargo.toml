[package]
name = "greencode-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "greencode-cli"
path = "src/bin/greencode-cli.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
font8x8 = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
png = "0.18"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
regex-lite = "0.1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "net"] }
toml = "1"
toml_edit = "0.25"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
